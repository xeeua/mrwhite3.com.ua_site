name: Оновлення меню зі Stravopys

on:
  schedule:
    # 04:00 UTC = 06:00/07:00 за Києвом (до відкриття закладу)
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install certifi

      - name: Run scraper
        run: python3 scripts/update_menu.py

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/menu.json menu.html sitemap.xml
            git commit -m "chore: автооновлення меню зі Stravopys"
            git push
          else
            echo "Змін немає, коміт не потрібен."
          fi
